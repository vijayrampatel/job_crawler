name: LinkedIn Job Crawler and Matcher

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-crawler-main
  cancel-in-progress: false

jobs:
  crawl-and-match:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 selenium webdriver-manager
          pip install pandas numpy scikit-learn openpyxl

      - name: Run LinkedIn crawler
        run: python linkedin_crawler.py

      - name: Run TF-IDF matcher
        env:
          SENDER_EMAIL: ${{ vars.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ vars.RECIPIENT_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: python tfidf_matcher.py

      - name: Commit and push changes
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          git pull --rebase origin main

          git add data/database.json data/carwler.json
          git commit -m "Update job database [skip ci]" || exit 0

          git push origin main
